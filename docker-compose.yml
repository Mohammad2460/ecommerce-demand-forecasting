# Data (data/raw/olist) and outputs (data/processed, models) are mounted from the host.
# First run:  docker compose run --rm pipeline   then:  docker compose up api dashboard
services:
  pipeline:
    build: .
    command: python scripts/run_pipeline.py
    volumes: [./data:/app/data, ./models:/app/models, ./reports:/app/reports]
    profiles: [pipeline]

  api:
    build: .
    command: uvicorn ecom.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: [./data:/app/data:ro, ./models:/app/models:ro]

  dashboard:
    build: .
    command: streamlit run src/ecom/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    volumes: [./data:/app/data:ro, ./models:/app/models:ro]
