[project]
name = "ecom"
version = "0.1.0"
description = "Intelligent E-Commerce Demand Forecasting & Customer Analytics System (Olist)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "plotly>=5.20",
    "streamlit>=1.35",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "joblib>=1.3",
    "holidays>=0.47",
    "matplotlib>=3.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "ipykernel>=6.29", "nbformat>=5.10", "nbconvert>=7.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
